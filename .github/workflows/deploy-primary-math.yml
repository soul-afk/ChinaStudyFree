name: Deploy 小学数学 网页版

on:
  push:
    branches: [main, my-modify]
    paths:
      - "apps/primary-math/**"
      - ".github/workflows/deploy-primary-math.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 生成静态站点
        working-directory: apps/primary-math
        run: |
          node build-data.mjs
          node build-site.mjs
      - name: 启用 Pages（若尚未开启）
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/primary-math/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
